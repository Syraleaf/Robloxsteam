<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand"><img src="logo.svg" alt="Roblox"></a>
    <nav class="toplinks">
      <a class="active">Discover</a><a>Marketplace</a><a>Create</a><a>Robux</a>
    </nav>
    <div class="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 105 11.9l4.6 4.6 1.4-1.4-4.6-4.6A7 7 0 0010 3zm0 2a5 5 0 110 10 5 5 0 010-10z"/></svg><span>Search</span></div>
    <div class="top-right">
      <span class="robux"><i></i>0</span>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 002.5-2.5h-5A2.5 2.5 0 0012 22zm7-6V11a7 7 0 00-5.5-6.8V3a1.5 1.5 0 00-3 0v1.2A7 7 0 005 11v5l-2 2v1h18v-1z"/></svg>
      <svg class="icon" viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 001.7 1L11 21h4l.4-2.9a7.6 7.6 0 001.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
      <div class="avatar" id="topAvatar"></div>
    </div>
  </header>

  <aside class="sidebar">
    <a class="active"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</a>
    <a><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>Profile</a>
    <a><svg viewBox="0 0 24 24"><path d="M3 4h18v13H8l-5 4z"/></svg>Messages</a>
    <a><svg viewBox="0 0 24 24"><path d="M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm7 0a3 3 0 100-6 3 3 0 000 6zM9 13c-3 0-6 1.5-6 4v2h12v-2c0-2.5-3-4-6-4zm7 0c-.5 0-1 0-1.500.1 1.600 1 2.500 2.400 2.500 3.900v2h4v-2c0-2-2.500-4-5-4z"/></svg>Friends</a>
    <a><svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 100 8 4 4 0 000-8zM6 12l-3 3 3 2v5h12v-5l3-2-3-3z"/></svg>Avatar</a>
    <a><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4zm8 2L7 7v8l5 2.500L17 15V7z"/></svg>Inventory</a>
    <a><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3 1.400-1.400L22 8l-5.600 5.400L15 12l3-3H7zm10 10H6l3 3-1.400 1.400L2 16l5.600-5.400L9 12l-3 3h11z"/></svg>Trade</a>
    <a><svg viewBox="0 0 24 24"><path d="M12 3l9 4v6c0 4-4 7-9 8-5-1-9-4-9-8V7z"/></svg>Communities</a>
    <a><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zm3 4v2h10V8zm0 4v2h10v-2zm0 4v2h6v-2z"/></svg>Blog</a>
    <a><svg viewBox="0 0 24 24"><path d="M5 7h14l1 13H4zm4-1a3 3 0 016 0h-2a1 1 0 00-2 0z"/></svg>Shop</a>
    <button class="premium">Get Premium</button>
  </aside>

  <main id="main"></main>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog">
      <img src="logo.svg" alt="">
      <h2 id="dlgTitle">Starting Roblox...</h2>
      <div class="bar"><div></div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
